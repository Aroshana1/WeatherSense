<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport meta tag: ensures the page scales correctly on mobile.
         width=device-width: page width = device screen width (not zoomed out)
         initial-scale=1.0: no zoom applied on first load -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO: Title shown in browser tab and search results -->
    <title>WeatherSense — Meteorological Comfort Station</title>

    <!-- SEO: Description shown below the title in Google search results. -->
    <meta
      name="description"
      content="WeatherSense — Real-time retro meteorological comfort station providing telemetry, comfort scoring, and weather diagnostics across global cities."
    />

    <!-- Google Fonts: Inter, Chakra Petch (Retro Instrument Display), JetBrains Mono (Telemetry Data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/assets/index-DhR3iJsg.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DJ3IfV9j.css">
  </head>

  <body>
    <!-- #root is the single DOM node React will mount the entire app into.
         React calls ReactDOM.createRoot(document.getElementById('root'))
         in main.jsx and takes full control of everything inside this div.
         The div starts empty; React renders the component tree into it. -->
    <div id="root"></div>

    <!-- The main entry-point JavaScript module.
         type="module" tells the browser this is an ES Module (import/export
         syntax).  Vite transforms this for the browser during development
         and bundles it for production with `npm run build`. -->
  </body>
</html>
